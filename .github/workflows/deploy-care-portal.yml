name: Deploy Care Provider Portal

on:
  push:
    branches:
      - main
    paths:
      - "doctor-portal/**"
      - ".github/workflows/deploy-care-portal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-care-portal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy care.nouriva.tech
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: doctor-portal/package-lock.json

      - name: Install and build
        working-directory: doctor-portal
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: doctor-portal
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
