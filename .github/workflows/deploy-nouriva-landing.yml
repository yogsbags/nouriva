name: Deploy Nouriva Landing

on:
  push:
    branches:
      - main
    paths:
      - "nouriva-landing/**"
      - ".github/workflows/deploy-nouriva-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nouriva-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy nouriva.tech to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare Pages access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Pages projects visible to this token:"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result[]?.name // empty, (.success | tostring), (.errors[]?.message // "no errors")'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: odd-sun-d4b3
          directory: nouriva-landing
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
