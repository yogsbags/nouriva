name: Deploy Nouriva Landing

on:
  push:
    branches:
      - main
    paths:
      - "nouriva-landing/**"
      - ".github/workflows/deploy-nouriva-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nouriva-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy nouriva.tech to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy nouriva-landing --project-name=nouriva-tech
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
