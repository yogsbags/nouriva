name: Deploy Nouriva Landing

on:
  push:
    branches:
      - main
    paths:
      - "nouriva-landing/**"
      - "doctor-portal/**"
      - ".github/workflows/deploy-nouriva-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nouriva-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy nouriva.tech to Cloudflare
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: doctor-portal/package-lock.json

      - name: Build care provider portal
        working-directory: doctor-portal
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: nouriva-landing
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
